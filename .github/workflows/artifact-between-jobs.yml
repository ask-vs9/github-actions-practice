name: Day 44 - Artifact Between Jobs

on:
  push:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate File
        run: |
          echo "Hello from Job 1" > job-output.txt
          echo "This file was created in the generate job." >> job-output.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-output
          path: job-output.txt

  consume:
    needs: generate
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: job-output

      - name: Read Artifact
        run: cat job-output.txt
