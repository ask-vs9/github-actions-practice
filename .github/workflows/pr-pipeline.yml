name: PR Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

jobs:
  build-test:
    name: Build and Test
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      python_version: "3.12"
      run_tests: true

  pr-comment:
    name: PR Check Message
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Show PR Check Result
        run: |
          echo "PR checks passed for branch: ${{ github.head_ref }}"
